# Logs del cluster y del servidor Spark Connect.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Arranque del cluster y del servidor Connect (puertos, workers registrados)
logger.master.name = org.apache.spark.deploy.master.Master
logger.master.level = info
logger.worker.name = org.apache.spark.deploy.worker.Worker
logger.worker.level = info
logger.connect.name = org.apache.spark.sql.connect.service.SparkConnectServer
logger.connect.level = info

# Ejecucion de pipelines (flows, datasets, refresh)
logger.pipelines.name = org.apache.spark.sql.pipelines
logger.pipelines.level = info

# Ruido conocido de Spark en Windows (no puede borrar sus temporales al cerrar)
logger.shutdown.name = org.apache.spark.util.ShutdownHookManager
logger.shutdown.level = off
logger.sparkenv.name = org.apache.spark.SparkEnv
logger.sparkenv.level = error
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error
