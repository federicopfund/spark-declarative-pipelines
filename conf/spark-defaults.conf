# Propiedades del servidor Spark Connect que ejecuta los pipelines
# (mismo formato que $SPARK_HOME/conf/spark-defaults.conf).
# Las rutas absolutas (warehouse, jars) las agrega bin\start-cluster.ps1 con --conf.

# ---- Cluster Standalone local ----
spark.master                                   spark://127.0.0.1:7077
spark.driver.memory                            1g
spark.executor.memory                          1g
spark.executor.cores                           1
spark.cores.max                                2
spark.sql.shuffle.partitions                   4
spark.ui.showConsoleProgress                   false

# ---- Spark Connect ----
spark.connect.grpc.binding.address             127.0.0.1
spark.connect.grpc.binding.port                15002

# ---- Catalogo: metastore Hive embebido (Derby) para que las tablas persistan entre ejecuciones ----
# Sin metastore persistente, la segunda ejecucion de un pipeline falla con LOCATION_ALREADY_EXISTS.
# La URL de Derby y spark.sql.warehouse.dir (rutas absolutas) las agrega bin\start-cluster.ps1.
spark.sql.catalogImplementation                hive
spark.sql.hive.metastore.schema.verification   false
spark.hadoop.datanucleus.schema.autoCreateAll  true
# ---- AUTO CDC (pendiente) ----
# create_auto_cdc_flow necesita un catalogo con SupportsRowLevelOperations (Apache Iceberg).
# Iceberg 1.12 (runtime Spark 4.1) no carga en Spark 4.3. Cuando exista iceberg-spark-runtime-4.3:
#   1. mover el jar a jars\
#   2. descomentar:
# spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
# spark.sql.catalog.lakehouse                  org.apache.iceberg.spark.SparkCatalog
# spark.sql.catalog.lakehouse.type             hadoop
